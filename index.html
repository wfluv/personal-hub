<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101112" />
    <meta name="description" content="Personal Hub — finances and work in one place." />
    <title>Personal Hub</title>
    <link rel="stylesheet" href="./src/styles.css?v=work-shifts-1" />
  </head>
  <body>
    <div id="app">
      <div class="app-layout">
        <aside class="sidebar" aria-label="Main navigation">
          <nav class="navigation">
            <button class="nav-button is-active" type="button" data-page="finances" aria-label="Finances" aria-current="page" title="Finances">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"></rect><path d="M3.5 9h17M16 14h.01"></path></svg>
            </button>
            <button class="nav-button" type="button" data-page="work" aria-label="Work" title="Work">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5"></rect><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12h18M10 12v2h4v-2"></path></svg>
            </button>
          </nav>
        </aside>

        <main class="main-content">
          <section class="page page-finances" data-view="finances" aria-label="Finances">
            <div class="balance-wrap">
              <div class="balance-control">
                <button class="allocation-trigger" type="button" aria-label="Show portfolio allocation" aria-expanded="false" aria-controls="allocation-popover">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
                </button>
                <div class="balance-amount" aria-label="Total balance">€0.00</div>
              </div>

              <section class="allocation-popover" id="allocation-popover" aria-label="Portfolio diversification" hidden>
                <div class="popover-heading">Portfolio allocation</div>
                <div class="allocation-list">
                  <div class="allocation-row"><span>Cash</span><span>—</span></div>
                  <div class="allocation-row"><span>Savings</span><span>—</span></div>
                  <div class="allocation-row"><span>Investments</span><span>—</span></div>
                  <div class="allocation-row"><span>Other</span><span>—</span></div>
                </div>
                <p class="popover-note">Your portfolio breakdown will appear here.</p>
              </section>
            </div>
          </section>

          <section class="page page-work" data-view="work" aria-label="Work" hidden>
            <div class="work-layout"><div class="work-calendar" aria-label="Work calendar">
              <header class="calendar-header">
                <h1 class="calendar-title" id="calendar-month"></h1>
                <div class="calendar-controls">
                  <button type="button" class="calendar-nav" id="calendar-prev" aria-label="Previous month">‹</button>
                  <button type="button" class="calendar-nav" id="calendar-next" aria-label="Next month">›</button>
                </div>
              </header>
              <div class="calendar-weekdays" aria-hidden="true">
                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
              </div>
              <div class="calendar-days" id="calendar-days" role="grid" aria-labelledby="calendar-month"></div>
            </div>
            <aside class="work-aside">
              <button class="add-shift-button" id="add-shift" type="button"><span class="add-shift-plus" aria-hidden="true">+</span> Add shift</button>
              <div class="work-stat"><div class="work-stat-name"><span class="work-dot primary"></span> Main work</div><div class="work-stat-line"><strong id="main-hours">0 <small>h</small></strong><span class="hourly-rate">— €/h</span></div></div>
              <div class="work-stat"><div class="work-stat-name"><span class="work-dot taltap"></span> TalTap</div><div class="work-stat-line"><strong id="taltap-hours">0 <small>h</small></strong><span class="hourly-rate">— €/h</span></div></div>
              <p class="work-stat-caption">Hours for the displayed month</p>
            </aside>
            </div>
            <dialog class="shift-dialog" id="shift-dialog" aria-labelledby="shift-dialog-title">
              <form id="shift-form">
                <div class="dialog-heading"><h2 id="shift-dialog-title">Add shift</h2><button class="dialog-close" id="close-shift" type="button" aria-label="Close">×</button></div>
                <label class="field-label" for="shift-date">Date</label>
                <input class="shift-input" id="shift-date" name="date" type="date" required />
                <label class="field-label" for="shift-type">Work</label>
                <select class="shift-input" id="shift-type" name="type"><option value="main">Main work</option><option value="taltap">TalTap</option></select>
                <label class="field-label" for="shift-hours">Hours</label>
                <input class="shift-input" id="shift-hours" name="hours" type="number" min="0.25" max="24" step="0.25" placeholder="8" inputmode="decimal" required />
                <button class="shift-submit" type="submit">Save shift</button>
              </form>
            </dialog>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="./src/main.js?v=work-shifts-1"></script>
  </body>
</html>
