/* Compact horizontal cash-flow chart */
.horizontal-chart{display:grid;gap:17px;margin-top:6px}
.horizontal-month{display:grid;grid-template-columns:35px minmax(0,1fr) 90px;align-items:center;gap:12px}
.horizontal-month-label{font-size:12px;font-weight:700;color:#68768a}
.horizontal-month-bars{display:grid;gap:7px}
.horizontal-track{height:10px;border-radius:6px;background:#f0f2f7;overflow:hidden}
.horizontal-fill{height:100%;border-radius:6px;transition:width .25s ease}
.horizontal-fill.income{background:#7769e2}
.horizontal-fill.expense{background:#45b89b}
.horizontal-values{display:grid;gap:3px;text-align:right;font-size:10px;color:#657387;font-variant-numeric:tabular-nums}
.horizontal-chart+.legend{margin-top:17px}
@media(max-width:480px){.horizontal-month{grid-template-columns:28px minmax(0,1fr) 66px;gap:7px}.horizontal-values{font-size:9px}}

es',fmt(exp()),'Расходы за месяц')}${stat('Net Cash Flow',fmt(inc()-exp()),'Доходы минус расходы',inc()-exp()>=0?'green':'orange')}${stat('Hours Worked',num(hours())+' h','Начислено '+fmt(earned()))}</div><div class="panels"><div class="panel"><h2>Cash Flow · 3 months</h2>${chart()}</div><div class="panel"><div class="panelheader"><h2>Recent Activity</h2><button class="btn" data-view="finance">View all</button></div>${recent.length?recent.map(x=>x.kind==='t'?row(x.category,(x.note||x.type)+' · '+datefmt(x.date),`${x.type==='income'?'+':'−'}${fmt(x.amount)}`,'◈',x.type==='income'?'green':'orange'):row(x.job,`${num(x.hours)} h · ${datefmt(x.date)}`,fmt(x.hours*x.rate),'◷')).join(''):'<div class="empty">Пока нет записей. Добавь первую операцию или смену.</div>'}</div></div><div class="grid2"><div class="panel"><div class="panelheader"><h2>Open Tasks</h2><button class="btn" data-view="projects">Manage</button></div>${data.tasks.filter(x=>x.status!=='Done').slice(0,4).map(x=>row(x.name,x.project||'General',`<span class="tag ${x.status==='In Progress'?'progress':'todo'}">${esc(x.status)}</span>`,'☑')).join('')||'<div class="empty">Задач пока нет</div>'}</div><div class="panel"><div class="panelheader"><h2>Active Projects</h2><button class="btn" data-add="project">＋ Project</button></div>${data.projects.filter(x=>x.status!=='Completed').slice(0,4).map(x=>row(x.name,x.area,`<span class="tag progress">${esc(x.status)}</span>`,'▤')).join('')||'<div class="empty">Добавь свой первый проект</div>'}</div></div>`}function chart(){const base=new Date(month+'-01T12:00:00');let a=[];for(let i=2;i>=0;i--){const d=new Date(base.getFullYear(),base.getMonth()-i,1),m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');a.push({name:d.toLocaleDateString('en-US',{month:'short'}),i:sum(data.transactions.filter(x=>x.type==='income'&&String(x.date).startsWith(m)),x=>x.amount),e:sum(data.transactions.filter(x=>x.type==='expense'&&String(x.date).startsWith(m)),x=>x.amount)})}const max=Math.max(1,...a.flatMap(x=>[x.i,x.e]));return `<div class="horizontal-chart">${a.map(x=>`<div class="horizontal-month"><div class="horizontal-month-label">${esc(x.name)}</div><div class="horizontal-month-bars"><div class="horizontal-track" title="${esc(x.name)} · Income ${fmt(x.i)}"><div class="horizontal-fill income" style="width:${x.i/max*100}%"></div></div><div class="horizontal-track" title="${esc(x.name)} · Expenses ${fmt(x.e)}"><div class="horizontal-fill expense" style="width:${x.e/max*100}%"></div></div></div><div class="horizontal-values"><span>${fmt(x.i)}</span><span>${fmt(x.e)}</span></div></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>Income</span><span><i class="dot exp"></i>Expenses</span></div>`}function tabs(opts,active,attr){return `<div class="tabs">${opts.map(([id,name])=>`<button class="tab ${id===active?'active':''}" data-${attr}="${id}">${name}</button>`).join('')}</div>`}function finance(){let out=`<div class="stats">${stat('Income',fmt(inc()),'За выбранный месяц','green')}${stat('Expenses',fmt(exp()),'За выбранный месяц','orange')}${stat('Balance Change',fmt(inc()-exp()),'Разница доходов и расходов')}${stat('Transactions',trans().length,'Записей в месяце')}</div>${tabs([['transactions','Transactions'],['budgets','Budgets'] ],financeTab,'fin-tab')}`;if(financeTab==='transactions')return out+`<div class="sectionhead"><h2>Transactions</h2><button class="btn primary" data-add="transaction">＋ Transaction</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Type</th><th class="right">Amount</th><th></th></tr></thead><tbody>${trans().slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${datefmt(x.date)}</td><td><strong>${esc(x.category)}</strong></td><td>${esc(x.note||'—')}</td><td><span class="tag ${x.type==='income'?'done':'todo'}">${x.type}</span></td><td class="right ${x.type==='income'?'green':'orange'}">${x.type==='income'?'+':'−'}${fmt(x.amount)}</td><td><button class="mini" data-delete="transactions:${x.id}" title="Delete">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Операций за этот месяц пока нет</td></tr>'}</tbody></table></div>`;const bs=data.budgets.filter(x=>x.month===month);return out+`<div class="sectionhead"><h2>Monthly Budgets</h2><button class="btn primary" data-add="budget">＋ Budget</button></div><div class="grid2">${bs.map(x=>{const spent=sum(trans().filter(t=>t.type==='expense'&&t.category.toLowerCase()===x.category.toLowerCase()),t=>t.amount),p=x.limit?spent/x.limit*100:0;return `<div class="panel"><div class="panelheader"><h2>${esc(x.category)}</h2><button class="mini" data-delete="budgets:${x.id}">✕</button></div><div class="statvalue">${fmt(spent)} <span class="muted">/ ${fmt(x.limit)}</span></div><div class="progressbar"><div style="width:${Math.min(100,p)}%;background:${p>100?'#ef8989':'#a899ff'}"></div></div><p class="hint">${num(p)}% used · ${fmt(x.limit-spent)} remaining</p></div>`}).join('')||'<div class="panel empty">Бюджетов пока нет. Создай лимит по категории расходов.</div>'}</div>`}function work(){let out=`<div class="stats">${stat('Hours Worked',num(hours())+' h','За выбранный месяц','accent')}${stat('Gross Earned',fmt(earned()),'Оценка до налогов')}${stat('Shifts',shifts().length,'Количество смен')}${stat('Average Rate',fmt(hours()?earned()/hours():0)+'/h','Средняя ставка')}</div>${tabs([['shifts','Shift Log'],['summary','By Workplace']],workTab,'work-tab')}`;if(workTab==='shifts')return out+`<div class="sectionhead"><h2>Shift Log</h2><button class="btn primary" data-add="shift">＋ Add Shift</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Workplace</th><th>Hours</th><th>Rate</th><th class="right">Gross Pay</th><th></th></tr></thead><tbody>${shifts().slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${datefmt(x.date)}</td><td><strong>${esc(x.job)}</strong></td><td>${num(x.hours)} h</td><td>${fmt(x.rate)}/h</td><td class="right green">${fmt(x.hours*x.rate)}</td><td><button class="mini" data-delete="shifts:${x.id}">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Смен пока нет</td></tr>'}</tbody></table></div><p class="hint">Gross Pay — расчётная сумма до налогов. Время и ставка вводятся вручную; учёт перерывов и доплат можно добавить в следующей версии.</p>`;const jobs=[...new Set(shifts().map(x=>x.job))];return out+`<div class="grid2">${jobs.map(j=>{const arr=shifts().filter(x=>x.job===j);return `<div class="panel"><h2>${esc(j)}</h2><div class="statvalue accent">${fmt(sum(arr,x=>x.hours*x.rate))}</div><div class="muted">${num(sum(arr,x=>x.hours))} hours · ${arr.length} shifts</div></div>`}).join('')||'<div class="panel empty">Добавь смены, чтобы увидеть разбивку по работодателям.</div>'}</div>`}function projects(){return `<div class="stats">${stat('Projects',data.projects.length,'Всего проектов')}${stat('Active',data.projects.filter(x=>x.status==='In Progress').length,'В работе','accent')}${stat('Open Tasks',data.tasks.filter(x=>x.status!=='Done').length,'Осталось выполнить')}${stat('Completed',data.tasks.filter(x=>x.status==='Done').length,'Завершённых задач','green')}</div><div class="sectionhead"><h2>Projects</h2><button class="btn primary" data-add="project">＋ New Project</button></div><div class="grid2">${data.projects.map(x=>{const ts=data.tasks.filter(t=>t.project===x.name),done=ts.filter(t=>t.status==='Done').length;return `<div class="panel"><div class="panelheader"><h2>${esc(x.name)}</h2><button class="mini" data-delete="projects:${x.id}">✕</button></div><div class="muted">${esc(x.area)} · <span class="tag ${x.status==='Completed'?'done':'progress'}">${esc(x.status)}</span></div><div class="progressbar"><div style="width:${ts.length?done/ts.length*100:0}%"></div></div><p class="hint">${done} / ${ts.length} tasks completed</p><select class="month" data-project-status="${x.id}" aria-label="Project status">${['Idea','Planning','In Progress','On Hold','Completed'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`}).join('')||'<div class="panel empty">Проектов пока нет</div>'}</div><div class="sectionhead"><h2>Tasks</h2><button class="btn primary" data-add="task">＋ New Task</button></div><div class="tablewrap"><table><thead><tr><th>Task</th><th>Project</th><th>Priority</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${data.tasks.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.project||'—')}</td><td>${esc(x.priority)}</td><td>${datefmt(x.due)}</td><td><select class="month" data-task-status="${x.id}">${['To Do','In Progress','Done'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="mini" data-delete="tasks:${x.id}">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Задач пока нет</td></tr>'}</tbody></table></div>`}function settings(){return `<div class="grid2"><div class="panel"><h2>Data & Backup</h2><p class="hint">Данные хранятся в localStorage текущего браузера. Они не синхронизируются между устройствами. Экспортируй резервную копию регулярно.</p><div class="actions"><button class="btn primary" id="export">↓ Export JSON</button><button class="btn" id="importbtn">↑ Import JSON</button><input id="importfile" class="hide" type="file" accept="application/json,.json"></div></div><div class="panel"><h2>Workspace</h2><p class="hint">Personal Hub v1 · offline-friendly single-page app. No account, tracking, analytics, or server required.</p><p class="hint">${data.transactions.length} transactions · ${data.shifts.length} shifts · ${data.projects.length} projects · ${data.tasks.length} tasks</p><button class="btn danger" id="reset">Delete all local data</button></div></div><div class="panel"><h2>Roadmap</h2><p class="hint">Next: cloud sync, login, repeating transactions, paid-vs-earned reconciliation, editable entries, recurring shifts, full calendar, business profit tracking and installable PWA hosting.</p></div>`}const field=(name,label,type='text',value='',extra='')=>`<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra} required></label>`,select=(name,label,options)=>`<label class="field"><span>${label}</span><select name="${name}" required>${options.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label>`,today=()=>new Date().toLocaleDateString('sv-SE');function modalHtml(){const t=modal;let content='';if(t==='transaction')content=select('type','Type',['expense','income'])+field('date','Date','date',today())+select('category','Category',['Food','Groceries','Transport','Housing','Utilities','Shopping','Health','Entertainment','Subscriptions','Salary','Side Income','Business','Other'])+field('amount','Amount (€)','number','', 'min="0.01" step="0.01"')+`<label class="field full"><span>Note (optional)</span><input name="note" placeholder="Description"></label>`;if(t==='shift')content=field('date','Date','date',today())+select('job','Workplace',['Trigers','TalTap','Side Hustle','Other'])+field('hours','Hours worked','number','','min="0.1" step="0.1"')+field('rate','Gross hourly rate (€)','number','','min="0" step="0.01"');if(t==='budget')content=field('month','Month','month',month)+select('category','Expense category',['Food','Groceries','Transport','Housing','Utilities','Shopping','Health','Entertainment','Subscriptions','Business','Other'])+field('limit','Monthly limit (€)','number','','min="0.01" step="0.01"');if(t==='project')content=field('name','Project name')+select('area','Area',['Main Job','Part-time','Side Hustle','Personal'])+select('status','Status',['Idea','Planning','In Progress','On Hold','Completed']);if(t==='task')content=field('name','Task name')+select('project','Project',['',...data.projects.map(x=>x.name)])+select('priority','Priority',['Medium','High','Low'])+field('due','Due date','date',today())+select('status','Status',['To Do','In Progress','Done']);return `<div class="modalback" id="modalback"><div class="modal" role="dialog" aria-modal="true" aria-label="Add ${esc(t)}"><h2>Add ${esc(t[0].toUpperCase()+t.slice(1))}</h2><form id="entryform"><div class="formgrid">${content}</div><div class="modalfoot"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></form></div></div>`}function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#month')?.addEventListener('change',e=>setMonth(e.target.value));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{modal=b.dataset.add;render()});document.querySelectorAll('[data-fin-tab]').forEach(b=>b.onclick=()=>{financeTab=b.dataset.finTab;render()});document.querySelectorAll('[data-work-tab]').forEach(b=>b.onclick=()=>{workTab=b.dataset.workTab;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const [table,id]=b.dataset.delete.split(':');if(confirm('Удалить запись?')){data[table]=data[table].filter(x=>x.id!==id);save();render()}});document.querySelectorAll('[data-task-status]').forEach(s=>s.onchange=()=>{const t=data.tasks.find(x=>x.id===s.dataset.taskStatus);if(t){t.status=s.value;save();render()}});document.querySelectorAll('[data-project-status]').forEach(s=>s.onchange=()=>{const p=data.projects.find(x=>x.id===s.dataset.projectStatus);if(p){p.status=s.value;save();render()}});$('#cancel')?.addEventListener('click',()=>{modal=null;render()});$('#modalback')?.addEventListener('click',e=>{if(e.target.id==='modalback'){modal=null;render()}});$('#entryform')?.addEventListener('submit',e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries()),id=uid();if(modal==='transaction'){o.amount=Number(o.amount);if(!(o.amount>0))return toast('Укажи сумму больше нуля');data.transactions.push({...o,id})}if(modal==='shift'){o.hours=Number(o.hours);o.rate=Number(o.rate);if(!(o.hours>0)||o.rate<0)return toast('Проверь часы и ставку');data.shifts.push({...o,id})}if(modal==='budget'){o.limit=Number(o.limit);if(!(o.limit>0))return toast('Укажи лимит');data.budgets=data.budgets.filter(x=>!(x.month===o.month&&x.category===o.category));data.budgets.push({...o,id})}if(modal==='project')data.projects.push({...o,id});if(modal==='task')data.tasks.push({...o,id});modal=null;save();render();toast('Запись сохранена')});$('#export')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='personal-hub-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('#importbtn')?.addEventListener('click',()=>$('#importfile').click());$('#importfile')?.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text()),d=obj.data||obj;if(!Object.keys(blank()).every(k=>Array.isArray(d[k])))throw Error('invalid');if(!confirm('Импорт заменит все текущие данные. Продолжить?'))return;data=Object.fromEntries(Object.keys(blank()).map(k=>[k,d[k]]));save();render();toast('Данные импортированы')}catch{toast('Неверный формат резервной копии')}});$('#reset')?.addEventListener('click',()=>{if(confirm('Удалить ВСЕ локальные данные? Это нельзя отменить без резервной копии.')){data=blank();save();render();toast('Данные удалены')}})}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});render()})();
</script></body></html>
