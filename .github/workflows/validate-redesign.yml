name: Validate Personal Hub

on:
  push:
    branches:
      - redesign
    paths:
      - '**.html'
      - 'PROJECT_PLAN.md'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - '**.html'
      - 'PROJECT_PLAN.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-check:
    name: Static app smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify app entry point
        run: |
          node <<'NODE'
          const fs = require('fs');

          const path = 'index.html';
          if (!fs.existsSync(path)) {
            console.error('Missing index.html');
            process.exit(1);
          }

          const html = fs.readFileSync(path, 'utf8');
          if (!html.trim()) {
            console.error('index.html is empty');
            process.exit(1);
          }

          const required = [
            /<!doctype html/i,
            /<html[\s>]/i,
            /<head[\s>]/i,
            /<body[\s>]/i,
            /<title[\s>]/i,
            /<\/html>/i
          ];

          const missing = required.filter((pattern) => !pattern.test(html));
          if (missing.length) {
            console.error('HTML entry point is missing required document elements.');
            process.exit(1);
          }

          console.log('Personal Hub entry point passed the smoke check.');
          NODE
